<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Creative Tracker</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    iframe { width: 100%; height: 100vh; border: 0; display: block; }
  </style>
</head>
<body>

  <iframe id="tilt-tracker"
          src="https://tiltcreativetracker.github.io/tilt-manager/"
          allow="clipboard-write"></iframe>

  <script>
    const TRACKER_ORIGIN = 'https://tiltcreativetracker.github.io';
    const frame = document.getElementById('tilt-tracker');

    // Listen for events coming FROM the tracker.
    window.addEventListener('message', (e) => {
      if (e.origin !== TRACKER_ORIGIN) return;
      if (!e.data || e.data.channel !== 'tilt-tracker/v1') return;

      const { type, payload } = e.data;
      console.log('Tracker event:', type, payload);

      // When Elsa clicks the "Report" button on a video in the tracker,
      // this fires with the video's details. Open the matching ad report
      // in this app.
      //
      // payload = {
      //   assetId, name, finalVideoUrl, rawVideoUrl,
      //   campaignId, campaignName, country, category
      // }
      //
      // TODO (friend): replace the line below with the actual URL your
      // ad-report page uses. A few common shapes:
      //   window.location.href = '/reports/' + payload.assetId;
      //   window.location.href = '/ads?search=' + encodeURIComponent(payload.name);
      //   window.open('/reports/ad?name=' + encodeURIComponent(payload.name), '_blank');
      if (type === 'openAdReport') {
        window.location.href = '/reports/ad?name=' + encodeURIComponent(payload.name);
      }
    });

    // Send commands TO the tracker.
    window.tellTracker = (type, payload) =>
      frame.contentWindow.postMessage(
        { channel: 'tilt-tracker/v1', type, payload, requestId: Date.now() },
        TRACKER_ORIGIN
      );
  </script>

</body>
</html>
